services:
  - type: web
    name: greenbuilder-bot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: SITE_BASE_URL
        value: https://www.greenbuildermedia.com
      - key: SITEMAP_URL
        value: https://www.greenbuildermedia.com/sitemap.xml
      - key: DATA_DIR
        value: /data
      - key: LANCEDB_DIR
        value: /data/lancedb
      - key: ENABLE_TRANSCRIPT_AUTO_SYNC
        value: true
      - key: PODCAST_TRANSCRIPT_DRIVE_FOLDER_ID
        value: 10yr6ZpJYdp_9mqQzgeiqw5vFOLs96Hja
      - key: TRANSCRIPT_SYNC_INTERVAL_SECONDS
        value: "604800"
      - key: CHAT_RESPONSE_CACHE_ENABLED
        value: true
      - key: CHAT_RESPONSE_CACHE_DIR
        value: /data/chat_response_cache
      - key: CHAT_RESPONSE_CACHE_TTL_SECONDS
        value: "10368000"
      - key: CHAT_RESPONSE_CACHE_TEMPORAL_TTL_SECONDS
        value: "21600"
